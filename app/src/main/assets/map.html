<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <style>
        html, body, #carte { height: 100%; margin: 0; padding: 0; }
        /* Repère rond bleu (charte du site), centré pixel-parfait sur le point sélectionné. */
        .grc-repere {
            width: 20px; height: 20px; border-radius: 50%;
            background: #2D6AB0; border: 3px solid #FFFFFF;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
<div id="carte"></div>
<script>
    var icone = L.divIcon({ className: '', html: '<div class="grc-repere"></div>', iconSize: [20, 20], iconAnchor: [10, 10] });
    var carte = L.map('carte', { zoomControl: true }).setView([43.7102, 7.2620], 13); // Centre par défaut : Nice (recentré dès que possible).
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }).addTo(carte);

    var marqueur = L.marker(carte.getCenter(), { icon: icone, draggable: true }).addTo(carte);

    function notifierPosition(lat, lng) {
        if (window.AndroidBridge && window.AndroidBridge.onPositionSelected) {
            window.AndroidBridge.onPositionSelected(lat, lng);
        }
    }

    marqueur.on('dragend', function () {
        var pos = marqueur.getLatLng();
        notifierPosition(pos.lat, pos.lng);
    });

    carte.on('click', function (e) {
        marqueur.setLatLng(e.latlng);
        notifierPosition(e.latlng.lat, e.latlng.lng);
    });

    // Appelée depuis Kotlin (webView.evaluateJavascript) pour centrer la carte
    // et repositionner le repère, typiquement une fois la position GPS obtenue.
    function definirPosition(lat, lng) {
        var pos = L.latLng(lat, lng);
        carte.setView(pos, 18);
        marqueur.setLatLng(pos);
    }
</script>
</body>
</html>
